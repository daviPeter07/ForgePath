name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate Bash integration
        run: |
          bash -n shell/forgepath.sh
          source shell/forgepath.sh
          start="$PWD"
          pushd /tmp >/dev/null
          fg back
          test "$PWD" = "$start"
          if fg back 2>/dev/null; then
            echo "fg back unexpectedly succeeded with an empty stack" >&2
            exit 1
          fi

      - name: Validate Bash integration reaches the fg executable
        # fg is also a Bash builtin (job control); the wrapper must run the
        # ForgePath executable, never the builtin.
        run: |
          stub="$(mktemp -d)"
          target="$(mktemp -d)"
          printf '%s\n' '#!/usr/bin/env bash' \
            'if [ -n "$FG_FAIL" ]; then exit 3; fi' \
            'if [ "$1" = pick ]; then printf "%s\n" "$FG_TARGET"; else printf "binary:%s\n" "$*"; fi' > "$stub/fg"
          chmod +x "$stub/fg"
          export FG_TARGET="$target"
          source shell/forgepath.sh

          PATH="$stub:$PATH"
          test "$(fg workspace add /work)" = "binary:workspace add /work"
          test "$(fg --version)" = "binary:--version"
          fg
          test "$PWD" = "$target"

          status=0
          FG_FAIL=1 fg || status=$?
          test "$status" -eq 3
          test "$PWD" = "$target"

          PATH="/usr/bin:/bin"
          if fg list 2>/dev/null; then
            echo "fg list succeeded without a ForgePath executable" >&2
            exit 1
          fi
          fg list 2>&1 | grep -q "ForgePath executable"

      - name: Validate PowerShell integration
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "shell/forgepath.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Write-Error
            exit 1
          }
          . ./shell/forgepath.ps1
          $start = (Get-Location).Path
          Push-Location -LiteralPath ([System.IO.Path]::GetTempPath())
          fg back
          if ((Get-Location).Path -ne $start) {
            throw "fg back did not restore the previous directory"
          }
          $Error.Clear()
          try {
            fg back 2>$null
          } catch {
            # expected
          }
          if ($Error.Count -eq 0) {
            throw "fg back unexpectedly succeeded with an empty stack"
          }

      - name: Validate fish integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish >/dev/null
          fish --no-execute shell/forgepath.fish
          stub="$(mktemp -d)"
          printf '%s\n' '#!/usr/bin/env bash' \
            'if [ -n "$FG_FAIL" ]; then exit 3; fi' \
            'if [ "$1" = pick ]; then printf "%s\n" "$FG_TARGET"; else printf "binary:%s\n" "$*"; fi' > "$stub/fg"
          chmod +x "$stub/fg"
          FG_TARGET="$(mktemp -d)" STUB="$stub" fish --no-config <<'FISH'
          source shell/forgepath.fish
          set -l start $PWD
          set -gx PATH $STUB $PATH

          test (fg workspace add /work) = "binary:workspace add /work"; or exit 1
          test (fg --version) = "binary:--version"; or exit 1

          fg; or exit 1
          test "$PWD" = "$FG_TARGET"; or exit 1
          fg back; or exit 1
          test "$PWD" = "$start"; or exit 1
          if fg back 2>/dev/null
              echo "fg back succeeded with an empty stack" >&2; exit 1
          end

          set -gx FG_FAIL 1
          fg
          test $status -eq 3; or exit 1
          test "$PWD" = "$start"; or exit 1
          set -e FG_FAIL

          set -gx PATH /usr/bin /bin
          if fg list 2>/dev/null
              echo "fg list succeeded without a ForgePath executable" >&2; exit 1
          end
          fg list 2>&1 | string match -q '*ForgePath executable*'; or exit 1
          echo "fish integration ok"
          FISH
